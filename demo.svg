<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 200" width="520" height="200">
  <rect width="520" height="200" rx="16" fill="#0d1117"/>

  <!-- Labels top -->
  <text x="80" y="28" text-anchor="middle" fill="#52B788" font-size="11" font-family="system-ui,sans-serif" font-weight="600" opacity="0.7">CalorieRing</text>
  <text x="300" y="28" text-anchor="middle" fill="#52B788" font-size="11" font-family="system-ui,sans-serif" font-weight="600" opacity="0.7">MacroRingGroup</text>

  <!-- Divider -->
  <line x1="185" y1="20" x2="185" y2="185" stroke="#1a3a2a" stroke-width="1"/>

  <!-- ── CalorieRing (left) ── -->
  <!-- Track -->
  <circle cx="80" cy="108" r="52" fill="none" stroke="#1a3a2a" stroke-width="8"/>
  <!-- Progress ring — animates from 0 to 72% -->
  <circle cx="80" cy="108" r="52" fill="none" stroke="#52B788" stroke-width="8"
    stroke-dasharray="326.7" stroke-dashoffset="326.7" stroke-linecap="round"
    transform="rotate(-90 80 108)">
    <animate attributeName="stroke-dashoffset" from="326.7" to="91.5" dur="1.4s" begin="0.2s" fill="freeze" calcMode="spline" keySplines="0.4 0 0.2 1"/>
  </circle>
  <!-- Center text -->
  <text x="80" y="103" text-anchor="middle" fill="#ffffff" font-size="18" font-family="system-ui,sans-serif" font-weight="700">1,512</text>
  <text x="80" y="119" text-anchor="middle" fill="rgba(255,255,255,0.35)" font-size="10" font-family="system-ui,sans-serif">/ 2,100 kcal</text>
  <!-- Remaining -->
  <text x="80" y="174" text-anchor="middle" fill="#52B788" font-size="12" font-family="system-ui,sans-serif" font-weight="500">588 remaining</text>
  <!-- Progress bar -->
  <rect x="28" y="158" width="104" height="5" rx="3" fill="#1a3a2a"/>
  <rect x="28" y="158" width="0" height="5" rx="3" fill="#52B788">
    <animate attributeName="width" from="0" to="75" dur="1.4s" begin="0.2s" fill="freeze" calcMode="spline" keySplines="0.4 0 0.2 1"/>
  </rect>

  <!-- ── MacroRingGroup (right) — 3 rings ── -->

  <!-- Protein ring -->
  <circle cx="250" cy="108" r="34" fill="none" stroke="#1a3a2a" stroke-width="6"/>
  <circle cx="250" cy="108" r="34" fill="none" stroke="#F0B429" stroke-width="6"
    stroke-dasharray="213.6" stroke-dashoffset="213.6" stroke-linecap="round"
    transform="rotate(-90 250 108)">
    <animate attributeName="stroke-dashoffset" from="213.6" to="53.4" dur="1.4s" begin="0.4s" fill="freeze" calcMode="spline" keySplines="0.4 0 0.2 1"/>
  </circle>
  <text x="250" y="112" text-anchor="middle" fill="#ffffff" font-size="11" font-family="system-ui,sans-serif" font-weight="600">75%</text>
  <text x="250" y="158" text-anchor="middle" fill="#F0B429" font-size="11" font-family="system-ui,sans-serif" font-weight="600">120g</text>
  <text x="250" y="172" text-anchor="middle" fill="rgba(255,255,255,0.3)" font-size="9" font-family="system-ui,sans-serif">Protein</text>

  <!-- Carbs ring -->
  <circle cx="350" cy="108" r="34" fill="none" stroke="#1a3a2a" stroke-width="6"/>
  <circle cx="350" cy="108" r="34" fill="none" stroke="#60a0ff" stroke-width="6"
    stroke-dasharray="213.6" stroke-dashoffset="213.6" stroke-linecap="round"
    transform="rotate(-90 350 108)">
    <animate attributeName="stroke-dashoffset" from="213.6" to="85.4" dur="1.4s" begin="0.6s" fill="freeze" calcMode="spline" keySplines="0.4 0 0.2 1"/>
  </circle>
  <text x="350" y="112" text-anchor="middle" fill="#ffffff" font-size="11" font-family="system-ui,sans-serif" font-weight="600">60%</text>
  <text x="350" y="158" text-anchor="middle" fill="#60a0ff" font-size="11" font-family="system-ui,sans-serif" font-weight="600">180g</text>
  <text x="350" y="172" text-anchor="middle" fill="rgba(255,255,255,0.3)" font-size="9" font-family="system-ui,sans-serif">Carbs</text>

  <!-- Fat ring -->
  <circle cx="450" cy="108" r="34" fill="none" stroke="#1a3a2a" stroke-width="6"/>
  <circle cx="450" cy="108" r="34" fill="none" stroke="#f06060" stroke-width="6"
    stroke-dasharray="213.6" stroke-dashoffset="213.6" stroke-linecap="round"
    transform="rotate(-90 450 108)">
    <animate attributeName="stroke-dashoffset" from="213.6" to="149.5" dur="1.4s" begin="0.8s" fill="freeze" calcMode="spline" keySplines="0.4 0 0.2 1"/>
  </circle>
  <text x="450" y="112" text-anchor="middle" fill="#ffffff" font-size="11" font-family="system-ui,sans-serif" font-weight="600">30%</text>
  <text x="450" y="158" text-anchor="middle" fill="#f06060" font-size="11" font-family="system-ui,sans-serif" font-weight="600">20g</text>
  <text x="450" y="172" text-anchor="middle" fill="rgba(255,255,255,0.3)" font-size="9" font-family="system-ui,sans-serif">Fat</text>
</svg>
